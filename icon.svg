<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1F6B4F"/>
      <stop offset="0.6" stop-color="#123A2F"/>
      <stop offset="1" stop-color="#0A1D19"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7CF5D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7CF5D6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- leaves of the rainforest floor -->
