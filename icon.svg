  <circle cx="256" cy="256" r="225" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#19C3B1" stroke-width="10" stroke-opacity="0.55" stroke-dasharray="26 18"/>
